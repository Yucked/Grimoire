name: grimoire_stack

services:
    grimoire:
        container_name: grimoire
        build: .
        restart: unless-stopped
        networks:
            - net-grim
        ports:
            - 7000:7000
        volumes:
            - ./data/config.json:/app/out/config.json

    ravendb:
      container_name: db-ravendb
      image: ravendb/ravendb:ubuntu-latest
      restart: unless-stopped
      networks:
        - net-grim    
      ports:
        - 7004:8080
      environment:
        RAVEN_ARGS: '--log-to-console'
        RAVEN_Setup_Mode: None
        RAVEN_Security_UnsecuredAccessAllowed: PrivateNetwork
      volumes:
        - ./data/ravendb:/db
    
    minio:
      image: minio/minio
      container_name: minio
      networks:
        - net-grim
      ports:
        - 9000:9000
        - 9001:9001
      environment:
        MINIO_ROOT_USER: grimoire
        MINIO_ROOT_PASSWORD: grimoire
      command: server /data --console-address ":9001"
      volumes:
        - ./data/minio:/data

    frontend:
      container_name: grimoire-frontend
      build:
        context: ./frontend
        dockerfile: Dockerfile
      restart: unless-stopped
      networks:
        - net-grim
      ports:
        - 3000:3000
      environment:
        - PUBLIC_API_URL=http://grimoire:7000
        - PUBLIC_MINIO_URL=http://minio:9000
      depends_on:
        - grimoire

networks:
    net-grim: